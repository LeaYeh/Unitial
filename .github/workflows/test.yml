name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck setup.sh
        run: shellcheck -S warning setup.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Unitial
        uses: actions/checkout@v4
        with:
          path: unitial

      - name: Checkout LeaYeh/skills
        uses: actions/checkout@v4
        with:
          repository: LeaYeh/skills
          path: skills

      - name: Run setup.sh (symlink mode)
        env:
          UNITIAL_DIR: ${{ github.workspace }}/unitial
          SKILLS_DIR: ${{ github.workspace }}/skills
        run: bash "${{ github.workspace }}/unitial/setup.sh"

      - name: Verify Claude Code symlinks
        run: |
          set -eo pipefail

          echo "=== checking symlinks exist ==="
          test -L ~/.claude/CLAUDE.md     || { echo "FAIL: CLAUDE.md is not a symlink";     exit 1; }
          test -L ~/.claude/settings.json || { echo "FAIL: settings.json is not a symlink";  exit 1; }
          test -L ~/.claude/commands      || { echo "FAIL: commands is not a symlink";        exit 1; }

          echo "=== checking symlink targets ==="
          readlink ~/.claude/CLAUDE.md | grep -q "unitial/claude/CLAUDE.md" \
            || { echo "FAIL: unexpected CLAUDE.md target: $(readlink ~/.claude/CLAUDE.md)";     exit 1; }
          readlink ~/.claude/settings.json | grep -q "skills/settings.json" \
            || { echo "FAIL: unexpected settings.json target: $(readlink ~/.claude/settings.json)"; exit 1; }
          readlink ~/.claude/commands | grep -q "skills/commands" \
            || { echo "FAIL: unexpected commands target: $(readlink ~/.claude/commands)";       exit 1; }

          echo "=== checking targets are readable ==="
          test -f ~/.claude/CLAUDE.md     || { echo "FAIL: CLAUDE.md target unreadable";       exit 1; }
          test -f ~/.claude/settings.json || { echo "FAIL: settings.json target unreadable";    exit 1; }
          test -d ~/.claude/commands      || { echo "FAIL: commands target is not a directory"; exit 1; }

          echo "=== checking settings.json is valid JSON ==="
          jq '.' ~/.claude/settings.json > /dev/null

          echo "All Claude Code checks passed"

      - name: Verify dotfiles installed
        run: |
          set -e
          test -f ~/.gitconfig || { echo "FAIL: ~/.gitconfig not installed"; exit 1; }
          test -f ~/.vimrc     || { echo "FAIL: ~/.vimrc not installed";     exit 1; }
          echo "Dotfile checks passed"
